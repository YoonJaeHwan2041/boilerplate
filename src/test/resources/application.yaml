# 테스트 전용 설정 — 도커/PostgreSQL/AWS 없이 인메모리로 돈다.
# (src/test/resources 가 클래스패스에서 우선하므로 main 의 application.yaml 을 덮어쓴다.)
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-only-secret-0123456789-0123456789-0123456789-0123456789
  issuer: boilerplate
  access-token-validity-seconds: 1800
  refresh-secret: test-only-REFRESH-secret-0123456789-0123456789-0123456789
  refresh-token-validity-seconds: 1209600
  refresh-rotation: false
  refresh-cleanup-cron: "0 0 4 * * *"

app:
  cookie:
    secure: false
    same-site: Lax
    path: /api/v1/auth

# S3 클라이언트 빈은 지연 평가라 실제 자격증명 없이도 컨텍스트가 뜬다(region/bucket 만 있으면 됨).
aws:
  s3:
    region: ap-northeast-2
    bucket: test-bucket
